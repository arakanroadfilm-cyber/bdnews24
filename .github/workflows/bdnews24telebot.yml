name: BDNews24 Telegram Bot

on:
  schedule:
    # Runs every 15 minutes (Cron Syntax)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit posted_articles.json back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparse

      - name: Fetch News & Send Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python bdnews_bot.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted articles state" && git push)
